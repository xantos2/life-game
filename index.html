<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life — a tiny demo</title>
<meta name="description" content="Life — a pixel-art visual novel demo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='1' y='1' width='2' height='2' fill='%23ff5d8f'/><rect x='5' y='1' width='2' height='2' fill='%23ff5d8f'/><rect x='0' y='2' width='8' height='2' fill='%23ff5d8f'/><rect x='1' y='4' width='6' height='1' fill='%23ff5d8f'/><rect x='2' y='5' width='4' height='1' fill='%23ff5d8f'/><rect x='3' y='6' width='2' height='1' fill='%23ff5d8f'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game" class="theme-bright">
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>

    <canvas id="actor" width="100" height="140" hidden></canvas>

    <button id="invBtn" type="button" title="Inventory (I)" aria-label="Inventory" hidden><canvas width="16" height="16"></canvas><span class="badge" hidden>0</span></button>

    <div id="menu" class="overlay" hidden>
      <h1 id="logo" aria-label="Life"></h1>
      <div class="menu-sub">~ a tiny demo ~</div>
      <div class="menu-btns"></div>
      <div class="savehint"></div>
    </div>

    <div id="namecard" class="overlay" hidden>
      <form class="card" autocomplete="off">
        <h2 class="card-title">Who are you?</h2>
        <label for="nameInput">Name</label>
        <input id="nameInput" type="text" maxlength="16" spellcheck="false" placeholder="type here...">
        <div class="err" aria-live="polite"></div>
        <button type="submit" class="pbtn pbtn-go">Continue</button>
      </form>
    </div>

    <div id="cutname" hidden></div>
    <div id="cuttext" hidden></div>
    <div id="cutchoices" hidden></div>
    <div id="notice" hidden></div>
    <button id="skipBtn" type="button" title="Skip (Esc / S)" aria-label="Skip cutscene" hidden>SKIP &#9654;&#9654;</button>

    <div id="tbc" class="overlay" hidden>
      <h2 class="tbc-title">To be continued<span class="dots"></span></h2>
      <p class="tbc-sub">This path hasn't been written yet.</p>
      <button class="pbtn pbtn-go" id="tbcMenu">Main Menu</button>
    </div>
  </div>

  <div id="dialog" hidden>
    <div class="nametag" hidden></div>
    <div class="text"></div>
    <div class="next">&#9660;</div>
    <div class="choices"></div>
  </div>

  <div id="inv" hidden>
    <div class="inv-panel" role="dialog" aria-label="Inventory">
      <div class="inv-top"><h2>Inventory</h2><button type="button" class="inv-close pbtn small" aria-label="Close">X</button></div>
      <div class="inv-body"><div class="inv-grid"></div><div class="inv-detail"></div></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="debug" hidden>
    <div class="dbg-bar"><b>DEBUG</b> <button class="dbg-min" type="button">_</button></div>
    <div class="dbg-stats"></div>
    <div class="dbg-row"><button class="dbg-chat" type="button">toggle chatted</button><button class="dbg-kp" type="button">karma +5</button><button class="dbg-km" type="button">karma -5</button><button class="dbg-pebble" type="button">+pebble</button></div>
    <div class="dbg-row">luck <select class="dbg-luck"><option value="random">random</option><option value="success">force success</option><option value="fail">force fail</option></select><button class="dbg-reroll" type="button">clear rolls</button><button class="dbg-kgood" type="button">karma good</button><button class="dbg-kbad" type="button">karma 0</button></div>
    <div class="dbg-row"><select class="dbg-sel"></select><button class="dbg-go" type="button">jump</button><label><input type="checkbox" class="dbg-fx"> apply effects</label></div>
  </div>

  <div id="fade"></div>
  <div id="card"></div>
</div>

<script src="js/state.js"></script>
<script src="js/logic.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/art3.js"></script>
<script src="js/actors.js"></script>
<script src="js/scenes.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
