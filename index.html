<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life — a tiny demo</title>
<meta name="description" content="Life — a pixel-art visual novel demo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='1' y='1' width='2' height='2' fill='%23ff5d8f'/><rect x='5' y='1' width='2' height='2' fill='%23ff5d8f'/><rect x='0' y='2' width='8' height='2' fill='%23ff5d8f'/><rect x='1' y='4' width='6' height='1' fill='%23ff5d8f'/><rect x='2' y='5' width='4' height='1' fill='%23ff5d8f'/><rect x='3' y='6' width='2' height='1' fill='%23ff5d8f'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game" class="theme-bright">
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>

    <div id="hud" hidden>
      <div class="slot" title="Trinket"><canvas id="slotIcon" width="16" height="16"></canvas></div>
      <div class="slot-label"></div>
    </div>

    <div id="menu" class="overlay" hidden>
      <h1 id="logo" aria-label="Life"></h1>
      <div class="menu-sub">~ a tiny demo ~</div>
      <div class="menu-btns"></div>
      <div class="savehint"></div>
    </div>

    <div id="namecard" class="overlay" hidden>
      <form class="card" autocomplete="off">
        <h2 class="card-title">Who are you?</h2>
        <label for="nameInput">Name</label>
        <input id="nameInput" type="text" maxlength="16" spellcheck="false" placeholder="type here...">
        <div class="err" aria-live="polite"></div>
        <button type="submit" class="pbtn pbtn-go">Continue</button>
      </form>
    </div>

    <div id="cuttext" hidden></div>
    <div id="cutchoices" hidden></div>

    <div id="tbc" class="overlay" hidden>
      <h2 class="tbc-title">To be continued<span class="dots"></span></h2>
      <p class="tbc-sub">This path hasn't been written yet.</p>
      <button class="pbtn pbtn-go" id="tbcMenu">Main Menu</button>
    </div>
  </div>

  <div id="dialog" hidden>
    <div class="nametag" hidden></div>
    <div class="row"><canvas class="portrait" width="32" height="32" hidden></canvas><div class="text"></div></div>
    <div class="next">&#9660;</div>
    <div class="choices"></div>
  </div>

  <div id="fade"></div>
  <div id="card"></div>
</div>

<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/scenes.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
